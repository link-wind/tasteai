<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415" role="img" aria-labelledby="title desc"><title id="title">长度扩展：把新位置映射回熟悉范围</title><desc id="desc">线性插值将目标位置 t 映射为 t/4，8191 映射到 2047.75。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="415" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">长度扩展：把新位置映射回熟悉范围</text><text x="28" y="78" fill="#68756c" font-size="17" text-anchor="start">教学尺度：训练长度 2048 → 目标长度 8192，s=4</text><text x="28" y="112" fill="#24372e" font-size="19" text-anchor="start">目标位置 t</text><path d="M80,150 L700,150" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M80,142 L80,158" stroke="#68756c" fill="none" stroke-width="2"/><text x="80" y="184" fill="#24372e" font-size="17" text-anchor="middle">0</text><path d="M230,142 L230,158" stroke="#68756c" fill="none" stroke-width="2"/><text x="230" y="184" fill="#24372e" font-size="17" text-anchor="middle">2048</text><path d="M380,142 L380,158" stroke="#68756c" fill="none" stroke-width="2"/><text x="380" y="184" fill="#24372e" font-size="17" text-anchor="middle">4096</text><path d="M530,142 L530,158" stroke="#68756c" fill="none" stroke-width="2"/><text x="530" y="184" fill="#24372e" font-size="17" text-anchor="middle">6144</text><path d="M680,142 L680,158" stroke="#68756c" fill="none" stroke-width="2"/><text x="680" y="184" fill="#24372e" font-size="17" text-anchor="middle">8191</text><text x="28" y="254" fill="#24372e" font-size="19" text-anchor="start">映射 t/4</text><path d="M80,292 L700,292" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M80,284 L80,300" stroke="#68756c" fill="none" stroke-width="2"/><text x="80" y="326" fill="#24372e" font-size="17" text-anchor="middle">0</text><path d="M230,284 L230,300" stroke="#68756c" fill="none" stroke-width="2"/><text x="230" y="326" fill="#24372e" font-size="17" text-anchor="middle">512</text><path d="M380,284 L380,300" stroke="#68756c" fill="none" stroke-width="2"/><text x="380" y="326" fill="#24372e" font-size="17" text-anchor="middle">1024</text><path d="M530,284 L530,300" stroke="#68756c" fill="none" stroke-width="2"/><text x="530" y="326" fill="#24372e" font-size="17" text-anchor="middle">1536</text><path d="M680,284 L680,300" stroke="#68756c" fill="none" stroke-width="2"/><text x="680" y="326" fill="#24372e" font-size="17" text-anchor="middle">2047.75</text><path d="M80,196 L80,238" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M230,196 L230,238" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M380,196 L380,238" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M530,196 L530,238" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,196 L680,238" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="384" fill="#68756c" font-size="18" text-anchor="start">坐标间距压缩到 1/4；可计算新位置，不等于已验证长文本质量。</text></g></svg>