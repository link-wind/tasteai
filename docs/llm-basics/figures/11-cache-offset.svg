<svg xmlns="http://www.w3.org/2000/svg" width="760" height="403" viewBox="0 0 760 403" role="img" aria-labelledby="title desc"><title id="title">增量 RoPE：局部下标不等于逻辑位置</title><desc id="desc">新 token 是本次输入的第零项，但属于全序列位置 100。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="403" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">增量 RoPE：局部下标不等于逻辑位置</text><text x="28" y="78" fill="#68756c" font-size="18" text-anchor="start">缓存已处理位置 0…99，接着送入一个新 token</text><rect x="28" y="115" width="200" height="68" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="128.0" y="155.0" fill="#24372e" font-size="20" text-anchor="middle">0…98</text><rect x="252" y="115" width="200" height="68" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="352.0" y="155.0" fill="#24372e" font-size="20" text-anchor="middle">99</text><rect x="476" y="115" width="200" height="68" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="576.0" y="155.0" fill="#24372e" font-size="20" text-anchor="middle">新 token</text><path d="M230,149 L246,149" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M454,149 L470,149" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M576,190 L576,225" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="404" y="243" width="310" height="70" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="559.0" y="278.0" fill="#24372e" font-size="20" text-anchor="middle">正确：position = 100</text><text x="559.0" y="303.0" fill="#68756c" font-size="16" text-anchor="middle">offset = 已有缓存长度</text><rect x="28" y="243" width="310" height="70" rx="7" fill="#fae9df" stroke="#dce1d6"/><text x="183.0" y="278.0" fill="#24372e" font-size="20" text-anchor="middle">错误：position = 0</text><text x="183.0" y="303.0" fill="#68756c" font-size="16" text-anchor="middle">只看本次输入的局部下标</text><text x="28" y="372" fill="#68756c" font-size="18" text-anchor="start">先给新 Q/K 用逻辑位置旋转；已缓存的旧 K 不再旋转一次。</text></g></svg>