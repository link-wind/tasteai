<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title desc"><title id="title">从字符到字节：边界并不相同</title><desc id="desc">A、中和表情分别编码为 1、3、4 个 UTF-8 字节，共 8 字节。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="365" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">从字符到字节：边界并不相同</text><text x="28" y="76" fill="#68756c" font-size="17" text-anchor="start">一段文本，三种不同的计数边界</text><rect x="28" y="98" width="164" height="65" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="110.0" y="130.5" fill="#24372e" font-size="20" text-anchor="middle">A</text><text x="110.0" y="155.5" fill="#68756c" font-size="16" text-anchor="middle">U+0041</text><path d="M110.0,165 L110.0,194" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="38.0" y="208" width="139.0" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="107.5" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">41</text><text x="110.0" y="290" fill="#356f95" font-size="17" text-anchor="middle">1 个 UTF-8 字节</text><rect x="214" y="98" width="234" height="65" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="331.0" y="130.5" fill="#24372e" font-size="20" text-anchor="middle">中</text><text x="331.0" y="155.5" fill="#68756c" font-size="16" text-anchor="middle">U+4E2D</text><path d="M331.0,165 L331.0,194" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="224.0" y="208" width="66.33333333333333" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="257.1666666666667" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">E4</text><rect x="295.3333333333333" y="208" width="66.33333333333333" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="328.5" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">B8</text><rect x="366.66666666666663" y="208" width="66.33333333333333" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="399.8333333333333" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">AD</text><text x="331.0" y="290" fill="#356f95" font-size="17" text-anchor="middle">3 个 UTF-8 字节</text><rect x="470" y="98" width="262" height="65" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="601.0" y="130.5" fill="#24372e" font-size="20" text-anchor="middle">🙂</text><text x="601.0" y="155.5" fill="#68756c" font-size="16" text-anchor="middle">U+1F642</text><path d="M601.0,165 L601.0,194" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="480.0" y="208" width="55.5" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="507.75" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">F0</text><rect x="540.5" y="208" width="55.5" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="568.25" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">9F</text><rect x="601.0" y="208" width="55.5" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="628.75" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">99</text><rect x="661.5" y="208" width="55.5" height="49" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="689.25" y="238.5" fill="#24372e" font-size="20" text-anchor="middle">82</text><text x="601.0" y="290" fill="#356f95" font-size="17" text-anchor="middle">4 个 UTF-8 字节</text><text x="28" y="337" fill="#24372e" font-size="19" text-anchor="start">3 个 Unicode 码点  /  8 个字节  /  token 数取决于 tokenizer</text></g></svg>