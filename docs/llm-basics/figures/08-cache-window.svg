<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title desc"><title id="title">Attention Sink：前缀与窗口如何共存</title><desc id="desc">保留 0 到 3 和 94 到 99 的 KV，中间位置不在缓存中。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="365" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">Attention Sink：前缀与窗口如何共存</text><text x="28" y="78" fill="#68756c" font-size="18" text-anchor="start">长度 100；保留前缀 S=4 与最近窗口 W=6</text><rect x="28" y="125" width="57" height="62" rx="7" fill="#d9e8df" stroke="#dce1d6"/><text x="56.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">0</text><rect x="92" y="125" width="57" height="62" rx="7" fill="#d9e8df" stroke="#dce1d6"/><text x="120.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">1</text><rect x="156" y="125" width="57" height="62" rx="7" fill="#d9e8df" stroke="#dce1d6"/><text x="184.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">2</text><rect x="220" y="125" width="57" height="62" rx="7" fill="#d9e8df" stroke="#dce1d6"/><text x="248.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">3</text><rect x="284" y="125" width="57" height="62" rx="7" fill="#eeeae2" stroke="#dce1d6"/><text x="312.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">…</text><rect x="348" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="376.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">94</text><rect x="412" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="440.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">95</text><rect x="476" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="504.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">96</text><rect x="540" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="568.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">97</text><rect x="604" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="632.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">98</text><rect x="668" y="125" width="57" height="62" rx="7" fill="#e1ebf3" stroke="#dce1d6"/><text x="696.5" y="162.0" fill="#24372e" font-size="20" text-anchor="middle">99</text><text x="144" y="228" fill="#275d46" font-size="18" text-anchor="middle">前缀 / sink</text><text x="317" y="270" fill="#68756c" font-size="17" text-anchor="middle">中间位置 4…93 已逐出</text><text x="541" y="228" fill="#356f95" font-size="18" text-anchor="middle">最近窗口</text><text x="28" y="330" fill="#24372e" font-size="17" text-anchor="start">保留的 KV ≠ 所有历史内容。这里只展示缓存策略，不代表实测权重。</text></g></svg>