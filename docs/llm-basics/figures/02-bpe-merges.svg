<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">BPE：看见相邻片段逐步合并</title><desc id="desc">low 从三个单字节合并为 lo 和 w，再合并为 low。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="448" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">BPE：看见相邻片段逐步合并</text><text x="28" y="77" fill="#68756c" font-size="17" text-anchor="start">以 low 为例：每轮只应用新学到的一条规则</text><text x="28" y="138" fill="#24372e" font-size="18" text-anchor="start">初始字节</text><rect x="206.0" y="110" width="148.0" height="58" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="280.0" y="145.0" fill="#24372e" font-size="20" text-anchor="middle">l · 108</text><rect x="366.0" y="110" width="148.0" height="58" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="440.0" y="145.0" fill="#24372e" font-size="20" text-anchor="middle">o · 111</text><rect x="526.0" y="110" width="148.0" height="58" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="600.0" y="145.0" fill="#24372e" font-size="20" text-anchor="middle">w · 119</text><path d="M446,172 L446,202" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="238" fill="#24372e" font-size="18" text-anchor="start">rank 0</text><rect x="206.0" y="210" width="228.0" height="58" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="320.0" y="245.0" fill="#24372e" font-size="20" text-anchor="middle">lo · 256</text><rect x="446.0" y="210" width="228.0" height="58" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="560.0" y="245.0" fill="#24372e" font-size="20" text-anchor="middle">w · 119</text><path d="M446,272 L446,302" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="338" fill="#24372e" font-size="18" text-anchor="start">rank 1</text><rect x="206.0" y="310" width="468.0" height="58" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="440.0" y="345.0" fill="#24372e" font-size="20" text-anchor="middle">low · 257</text><text x="28" y="419" fill="#68756c" font-size="18" text-anchor="start">训练按语料频次选规则；编码按已学规则的 rank 应用。</text></g></svg>