<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">先划定边界，再在块内编码</title><desc id="desc">Hello、逗号、带空格的 world 和感叹号分开进入 BPE，再拼接输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="380" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">先划定边界，再在块内编码</text><text x="28" y="80" fill="#68756c" font-size="18" text-anchor="start">示意分块：Hello, world!（␠ 表示一个空格）</text><rect x="28" y="110" width="190" height="75" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="123.0" y="147.5" fill="#24372e" font-size="20" text-anchor="middle">Hello</text><text x="123.0" y="172.5" fill="#68756c" font-size="16" text-anchor="middle">字母块</text><path d="M123.0,189 L123.0,222" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="239" width="190" height="65" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="123.0" y="277.5" fill="#24372e" font-size="20" text-anchor="middle">BPE</text><rect x="236" y="110" width="80" height="75" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="276.0" y="147.5" fill="#24372e" font-size="20" text-anchor="middle">,</text><text x="276.0" y="172.5" fill="#68756c" font-size="16" text-anchor="middle">标点</text><path d="M276.0,189 L276.0,222" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="236" y="239" width="80" height="65" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="276.0" y="277.5" fill="#24372e" font-size="20" text-anchor="middle">BPE</text><rect x="334" y="110" width="250" height="75" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="459.0" y="147.5" fill="#24372e" font-size="20" text-anchor="middle">␠world</text><text x="459.0" y="172.5" fill="#68756c" font-size="16" text-anchor="middle">前导空格 + 字母</text><path d="M459.0,189 L459.0,222" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="334" y="239" width="250" height="65" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="459.0" y="277.5" fill="#24372e" font-size="20" text-anchor="middle">BPE</text><rect x="602" y="110" width="104" height="75" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="654.0" y="147.5" fill="#24372e" font-size="20" text-anchor="middle">!</text><text x="654.0" y="172.5" fill="#68756c" font-size="16" text-anchor="middle">标点</text><path d="M654.0,189 L654.0,222" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="602" y="239" width="104" height="65" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="654.0" y="277.5" fill="#24372e" font-size="20" text-anchor="middle">BPE</text><text x="28" y="350" fill="#24372e" font-size="18" text-anchor="start">块内可以合并；竖向边界限制了允许跨越的范围。</text></g></svg>