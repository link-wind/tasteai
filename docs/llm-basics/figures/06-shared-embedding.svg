<svg xmlns="http://www.w3.org/2000/svg" width="760" height="427" viewBox="0 0 760 427" role="img" aria-labelledby="title desc"><title id="title">Embedding 与 LM Head：同一张表，两种用法</title><desc id="desc">左边按 ID 取 E 的一行，右边用隐藏向量对 E 的各行评分。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="427" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">Embedding 与 LM Head：同一张表，两种用法</text><text x="28" y="77" fill="#68756c" font-size="17" text-anchor="start">同一个 E：输入时按编号取行，输出时与每行做点积</text><rect x="274" y="112" width="210" height="55" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="379.0" y="145.5" fill="#24372e" font-size="20" text-anchor="middle">E₀ = (1,0)</text><rect x="274" y="182" width="210" height="55" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="379.0" y="215.5" fill="#24372e" font-size="20" text-anchor="middle">E₁ = (0,1)</text><rect x="274" y="252" width="210" height="55" rx="7" fill="#eaf0f5" stroke="#dce1d6"/><text x="379.0" y="285.5" fill="#24372e" font-size="20" text-anchor="middle">E₂ = (1,1)</text><rect x="28" y="180" width="170" height="70" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="113.0" y="215.0" fill="#24372e" font-size="20" text-anchor="middle">ID = 2</text><text x="113.0" y="240.0" fill="#68756c" font-size="16" text-anchor="middle">输入 token</text><path d="M202,214 L266,278" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="180" width="192" height="70" rx="7" fill="#eef2e9" stroke="#dce1d6"/><text x="636.0" y="215.0" fill="#24372e" font-size="20" text-anchor="middle">h = (2,−1)</text><text x="636.0" y="240.0" fill="#68756c" font-size="16" text-anchor="middle">上下文化向量</text><path d="M538,212 L488,212" stroke="#68756c" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="354" fill="#275d46" font-size="19" text-anchor="start">查表结果：(1,1)</text><text x="396" y="354" fill="#ac6432" font-size="19" text-anchor="start">输出分数：(2,−1,1)</text><text x="28" y="398" fill="#68756c" font-size="17" text-anchor="start">共享权重不意味着 h 就是原始 Embedding；h 已经过上下文计算。</text></g></svg>