<svg xmlns="http://www.w3.org/2000/svg" width="760" height="442" viewBox="0 0 760 442" role="img" aria-labelledby="title desc"><title id="title">RoPE：位置变成平面上的旋转</title><desc id="desc">向量从第一象限逆时针转入第二象限，旋转前后都在半径根号五的圆上。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#68756c"/></marker></defs><rect width="760" height="442" fill="#fffefb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="28" y="38" fill="#24372e" font-size="23" text-anchor="start">RoPE：位置变成平面上的旋转</text><text x="28" y="78" fill="#68756c" font-size="18" text-anchor="start">单个二维平面：x=(1,2)，旋转 π/2 后为 (−2,1)</text><path d="M160,244 L590,244" stroke="#68756c" fill="none" stroke-width="2"/><path d="M375,370 L375,111" stroke="#68756c" fill="none" stroke-width="2"/><circle cx="375" cy="244" r="129.6919426949878" fill="none" stroke="#dce1d6" stroke-dasharray="5 5"/><path d="M375,244 L433,128" stroke="#356f95" fill="none" stroke-width="2" marker-end="url(#arrow)"/><path d="M375,244 L259,186" stroke="#275d46" fill="none" stroke-width="2" marker-end="url(#arrow)"/><text x="443" y="128" fill="#356f95" font-size="19" text-anchor="start">x=(1,2)</text><text x="247" y="171" fill="#275d46" font-size="19" text-anchor="end">R(π/2)x=(−2,1)</text><path d="M415,164 A90,90 0 0 0 295,204" fill="none" stroke="#ac6432" stroke-width="2" marker-end="url(#arrow)"/><text x="347" y="139" fill="#ac6432" font-size="18" text-anchor="start">π/2</text><text x="28" y="412" fill="#68756c" font-size="17" text-anchor="start">方向改变，长度仍为 √5；RoPE 对每一对维度分别做这样的旋转。</text></g></svg>